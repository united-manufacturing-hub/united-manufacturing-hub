kind: fixes
body: 'A degraded flow whose stream processor logged errors now counts down to when the error actually clears. The countdown is measured from the newest error line in the 10-minute window; before it was measured from the oldest, so a flow that kept erroring showed a countdown shorter than the time it needed and reached 0s while still degraded. The status still names the oldest line, which is the error that started it'
