kind: fixes
body: 'OPC UA input and output: fixed two vulnerabilities that let the OPC UA server a bridge connects to, or anyone who can inject into a connection with security mode None, take the bridge down with a crafted value. A 21-byte value made it use full CPU and ever more memory until it was killed ([CWE-835](https://cwe.mitre.org/data/definitions/835.html)); other crafted values crashed it or made it allocate gigabytes of memory from 10 bytes ([CWE-1284](https://cwe.mitre.org/data/definitions/1284.html), [CWE-789](https://cwe.mitre.org/data/definitions/789.html); reported by abdel084cb of Safetybits). Advisories: [GHSA-h3g2-2pf7-h77p](https://github.com/gopcua/opcua/security/advisories/GHSA-h3g2-2pf7-h77p), [GHSA-798p-q82c-7h3m](https://github.com/gopcua/opcua/security/advisories/GHSA-798p-q82c-7h3m). Affects benthos-umh v0.16.2 and earlier, including the version in the current umh-core. Update now; this fix might not be in a umh-core release yet'
time: 2026-11-18T21:00:00.000000+01:00
