# Builds the umh-core image. Runs for PRs (called by pull-request.yml), for
# every push to staging, for pre-release tags (vX.Y.Z-pre.N), which also notify
# the Management Console's nightly channel, and for stable releases (called by
# release-pipeline.yml with a commit and a version).

name: Build UMH Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Defaults to the commit of the calling event."
        required: false
        type: string
        default: ""
      version:
        description: "Release version (vX.Y.Z). Set only by release-pipeline.yml; tags the image with it instead of the branch."
        required: false
        type: string
        default: ""
    outputs:
      short-sha:
        description: "Short SHA for the image tag"
        value: ${{ jobs.build.outputs.short-sha }}
      digest:
        description: "Image manifest digest (sha256:...) of the pushed image"
        value: ${{ jobs.build.outputs.digest }}
  push:
    branches:
      - staging
    # Stable versions are released only by release-pipeline.yml.
    tags:
      - "v*-pre.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: united-manufacturing-hub/umh-core

jobs:
  build:
    name: Build and Push
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    runs-on: depot-ubuntu-24.04
    outputs:
      short-sha: ${{ steps.short-sha.outputs.sha }}
      digest: ${{ steps.digest.outputs.digest }}
      image-tag: ${{ steps.short-sha.outputs.image-tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            umh-core
            .github

      - name: Compute short SHA
        id: short-sha
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          sha=$(git rev-parse HEAD | cut -c1-7)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # A release image has no sha tag (see Docker meta), so it is found by
          # its version tag.
          echo "image-tag=${RELEASE_VERSION:-sha-${sha}}" >> "$GITHUB_OUTPUT"

      # Rebuilding a released version from its own commit is harmless.
      # Building it from a different commit would overwrite its image.
      - name: Check that the build does not replace a released image
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha 2>/dev/null) \
            && [ "$tagged" != "$head" ]; then
            echo "::error::${VERSION} is tagged on ${tagged}. Building it from ${head} would overwrite its image."
            exit 1
          fi

      - name: Check that no Management Console source is committed
        run: |
          if [ -e umh-core/vendor/github.com/united-manufacturing-hub/ManagementConsole ]; then
            echo "umh-core/vendor/ holds Management Console source; the official build fetches it at the version go.mod pins"
            exit 1
          fi

      - name: Generate a read token for the Management Console module
        id: mc-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.PR_APP_ID }}
          private-key: ${{ secrets.PR_APP_PK }}
          repositories: ManagementConsole
          permission-contents: read

      - name: Setup Depot
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_READ_ONLY_USER }}
          password: ${{ secrets.DOCKER_READ_ONLY_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest is the newest stable release. release-pipeline.yml moves it
          # only after the image is verified and the release is published.
          # A release build runs on a push to staging, but must not move the
          # staging or sha tags. Its version tag replaces them.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=ref,event=tag
            type=raw,value=sha-${{ steps.short-sha.outputs.sha }},enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Determine version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            echo "VERSION=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev-$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      # Runs visibly, so a download failure shows its real error; the build below hides its output.
      - name: Download image binaries
        working-directory: ./umh-core
        run: make download-docker-binaries

      # The official image includes a private module.
      # Its build output is hidden, because it can name private files.
      # Maintainers with read access to that module can rebuild the image locally to see a build error.
      - name: Build and Push
        working-directory: ./umh-core
        env:
          DEPOT_PROJECT_ID: ${{ secrets.DEPOT_PROJECT_ID }}
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          MC_READ_TOKEN: ${{ steps.mc-token.outputs.token }}
        run: |
          # Convert metadata tags to -t flags
          TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS="$TAGS -t $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          if make build-depot \
            VERSION=${{ steps.version.outputs.VERSION }} \
            TAGS="$TAGS" > /dev/null 2>&1; then
            echo "The official image build passed."
          else
            rc=$?
            echo "::error::The official image build failed. Its output is hidden, because it can name files of the private module the image includes. Maintainers with read access to that module can rebuild the image locally to see a build error."
            exit "$rc"
          fi

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.image-tag }}" --format '{{json .Manifest}}' | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  verify-binaries:
    name: Verify ${{ matrix.arch }} Image
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: depot-ubuntu-24.04-arm
            platform: linux/arm64
            expected_machine: "b700"
            expected_uname: "aarch64"
            arch_name: "ARM aarch64"
          - arch: amd64
            runner: depot-ubuntu-24.04
            platform: linux/amd64
            expected_machine: "3e00"
            expected_uname: "x86_64"
            arch_name: "x86-64"
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify runner architecture
        run: |
          ARCH=$(uname -m)
          echo "Runner architecture: $ARCH"
          echo "Expected: ${{ matrix.expected_uname }}"
          if [ "$ARCH" != "${{ matrix.expected_uname }}" ]; then
            echo "::error::Not running on expected architecture! Expected: ${{ matrix.expected_uname }}, Got: $ARCH"
            exit 1
          fi

      - name: Pull ${{ matrix.arch }} image with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_seconds: 120
          max_attempts: 5
          retry_wait_seconds: 10
          command: |
            set -euo pipefail
            IMAGE="ghcr.io/united-manufacturing-hub/umh-core:${{ needs.build.outputs.image-tag }}"
            echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            echo "Pulling ${{ matrix.arch }} image: $IMAGE"

            if docker pull --platform ${{ matrix.platform }} "$IMAGE"; then
              echo "Image pulled successfully"
              exit 0
            fi

            echo "::error::Failed to pull image"
            exit 1

      - name: Verify binary architectures
        env:
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          ARCH_NAME: ${{ matrix.arch_name }}
        run: |
          set -euo pipefail

          echo "Checking binary architectures..."
          echo "Expected machine type: $EXPECTED_MACHINE ($ARCH_NAME)"
          # Use od to read ELF header machine type (bytes 18-19)
          # ARM64 = b700, x86-64 = 3e00 (little-endian)
          docker run --rm --platform ${{ matrix.platform }} \
            -e EXPECTED_MACHINE="$EXPECTED_MACHINE" \
            -e ARCH_NAME="$ARCH_NAME" \
            "$IMAGE" sh -c '
            check_binary() {
              local binary=$1
              local machine=$(od -An -tx1 -j18 -N2 "$binary" 2>/dev/null | tr -d " ")

              if [ "$machine" = "$EXPECTED_MACHINE" ]; then
                echo "$binary: $ARCH_NAME"
              else
                echo "$binary: wrong arch ($machine, expected $EXPECTED_MACHINE)"
                return 1
              fi
            }

            failed=0
            # Note: /opt/redpanda/bin/redpanda is a shell wrapper script
            # The actual ELF binary is at /opt/redpanda/libexec/redpanda
            for bin in /usr/local/bin/benthos /opt/redpanda/libexec/redpanda /usr/local/bin/umh-core \
                       /command/s6-svscan /command/s6-supervise /command/execlineb; do
              check_binary "$bin" || failed=1
            done
            exit $failed
          ' | tee /tmp/arch-check.txt

          # Verify expected architecture found
          if ! grep -q "$ARCH_NAME" /tmp/arch-check.txt; then
            echo "::error::Binaries are not $ARCH_NAME!"
            cat /tmp/arch-check.txt
            exit 1
          fi

          echo "All binaries are native $ARCH_NAME"

      - name: Add to job summary
        if: always()
        run: |
          echo "## ${{ matrix.arch }} Binary Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture**: ${{ matrix.arch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform**: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/arch-check.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/arch-check.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # Stable versions notify the Management Console from release-pipeline.yml.
  notify-management-console:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') && inputs.version == ''
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Notify management console
        env:
          UMH_MC_WEBHOOK_SECRET: ${{ secrets.UMH_MC_WEBHOOK_SECRET }}
          VERSION: ${{ github.ref_name }}
        run: .github/scripts/notify-management-console.sh
