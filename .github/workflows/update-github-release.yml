# Populates GitHub Release notes from CHANGELOG.md on stable releases.
# Extracted from build-umh-core.yml to avoid granting contents:write
# in the reusable-workflow (workflow_call) path used by pull-request.yml.

name: Update GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to update (e.g., v0.44.10). Must already exist as a GitHub Release.'
        required: true
        type: string

jobs:
  update-github-release:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            umh-core/CHANGELOG.md
            umh-core/changelog-images/
          ref: ${{ inputs.version || github.event.release.tag_name }}

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SEMVER="${VERSION#v}"

          awk "/^## \\[${SEMVER}\\]/{found=1; next} /^## \\[/{if(found) exit} found" \
            umh-core/CHANGELOG.md | sed 's/^### /## /' > /tmp/release-body.md

          if [ ! -s /tmp/release-body.md ]; then
            echo "::warning::No changelog content found for ${SEMVER} in umh-core/CHANGELOG.md. GitHub Release body was NOT updated. Add a ## [${SEMVER}] section and re-run this workflow."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # IMPORTANT: Slug generation must match sync-changelog.ts generateSlug()
          # in the changelog.umh.app repo. If that function changes, update this too.
          # Extract title from release event payload (or fetch via gh for workflow_dispatch)
          RAW_TITLE="${RELEASE_NAME:-}"
          if [ -z "$RAW_TITLE" ]; then
            RAW_TITLE=$(gh release view "$VERSION" --json name --jq '.name' 2>/dev/null || echo "")
          fi
          TITLE=$(echo "$RAW_TITLE" | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*-[[:space:]]*//')

          if [ -n "$TITLE" ]; then
            # Generate slug (mirrors sync-changelog.ts generateSlug)
            SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-//; s/-$//')
            DATE=$(date +%Y-%m-%d)
            echo "" >> /tmp/release-body.md
            echo "See https://changelog.umh.app/changelog/${DATE}-${SLUG}-${VERSION}" >> /tmp/release-body.md
          else
            DATE=$(date +%Y-%m-%d)
            echo "" >> /tmp/release-body.md
            echo "See https://changelog.umh.app/changelog/${DATE}-umh-core-${VERSION}" >> /tmp/release-body.md
          fi

      - name: Update GitHub Release
        if: steps.changelog.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --notes-file /tmp/release-body.md

  # Runs for pre-releases too. Runs after update-github-release because that job overwrites the body.
  publish-image-digest:
    needs: [update-github-release]
    if: ${{ !cancelled() && needs.update-github-release.result != 'failure' }}
    runs-on: depot-ubuntu-24.04
    # The image is built by build-umh-core.yml on the tag push, which starts at the same time as this workflow.
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # Must match the cosign verify command in deployment-security.md.
      SIGNER_IDENTITY_REGEXP: '^https://github\.com/united-manufacturing-hub/united-manufacturing-hub/\.github/workflows/build-umh-core\.yml@refs/tags/v'
      SIGNER_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Waits until the image is signed by a tag build, and reads the signed index digest from the verification.
      - name: Wait for signed image
        id: image
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/united-manufacturing-hub/umh-core:${VERSION}"
          for attempt in $(seq 1 60); do
            if OUT=$(cosign verify \
                --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
                --certificate-oidc-issuer "$SIGNER_OIDC_ISSUER" \
                "$IMAGE" 2>/dev/null); then
              DIGEST=$(echo "$OUT" | jq -r '.[0].critical.image."docker-manifest-digest"')
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              echo "Signed index digest of $IMAGE: $DIGEST"
              exit 0
            fi
            echo "Attempt $attempt: $IMAGE is not signed yet, waiting 60s"
            sleep 60
          done
          echo "::error::$IMAGE was not signed within 60 minutes. Re-run this workflow once build-umh-core.yml has finished."
          exit 1

      - name: Add image digest to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # Drop an earlier "## Container image" section so re-runs do not add a second one.
          gh release view "$VERSION" --json body --jq .body \
            | awk '/^## Container image/{skip=1; next} /^## /{skip=0} !skip' \
            | awk 'NF {for (; blank > 0; blank--) print ""; print; next} {blank++}' > /tmp/release-body.md
          cat >> /tmp/release-body.md <<NOTES

          ## Container image

          \`management.umh.app/oci/united-manufacturing-hub/umh-core@${DIGEST}\`

          The image is signed with cosign. See [how to verify it](https://docs.umh.app/production/security/umh-core/deployment-security#image-signing).
          NOTES
          gh release edit "$VERSION" --notes-file /tmp/release-body.md

      # Customers pull through management.umh.app, a proxy in front of ghcr. This proves that
      # verification also works there. It runs after the digest is published, because the digest
      # is correct either way.
      - name: Verify image through management.umh.app
        env:
          IMAGE: management.umh.app/oci/united-manufacturing-hub/umh-core@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if ! cosign verify \
              --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$SIGNER_OIDC_ISSUER" \
              "$IMAGE" > /dev/null; then
            echo "::error::cosign verify fails through management.umh.app for $IMAGE, but works on ghcr.io. Check the OCI proxy in ManagementConsole (router/cmd/oci_v2)."
            exit 1
          fi
          echo "Verified $IMAGE through management.umh.app" >> "$GITHUB_STEP_SUMMARY"
