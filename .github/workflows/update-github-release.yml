# Populates the notes of a stable GitHub Release from CHANGELOG.md.
# release-pipeline.yml calls it for the released version.
#
# The notes come from release-notes.sh, so they also hold the sections of the
# versions it superseded. Those versions have no GitHub Release of their own.
#
# CHANGELOG.md is read from the calling commit (staging), not from the tag: the
# tag sits on the commit the release PR was generated from, whose CHANGELOG.md
# does not have the version's section yet.
#
# The notes link to the version's changelog.umh.app entry, so sync-changelog.yml
# must have run first. The entry's name holds the date it was synced, which a
# re-run can move to a later day, so the link is looked up, not computed.

name: Update GitHub Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Tag to update (e.g., v0.44.10). Must already exist as a GitHub Release.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to update (e.g., v0.44.10). Must already exist as a GitHub Release.'
        required: true
        type: string

jobs:
  update-github-release:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/
            umh-core/CHANGELOG.md
            umh-core/changelog-images/

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.CHANGELOG_SYNC_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_SYNC_APP_PK }}
          repositories: changelog.umh.app

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          SEMVER="${VERSION#v}"

          VERSION="$SEMVER" .github/scripts/release-notes.sh | sed 's/^###/##/' > /tmp/release-body.md

          if [ ! -s /tmp/release-body.md ]; then
            echo "::warning::No changelog content found for ${SEMVER} in umh-core/CHANGELOG.md. GitHub Release body was NOT updated. Add a ## [${SEMVER}] section and re-run this workflow."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          entry=$(gh api "repos/united-manufacturing-hub/changelog.umh.app/git/trees/HEAD:public/changelog/entries" \
            --jq ".tree[].path | select(endswith(\"-${VERSION}.md\"))" | sort | tail -1)
          if [ -n "$entry" ]; then
            echo "" >> /tmp/release-body.md
            echo "See https://changelog.umh.app/changelog/${entry%.md}" >> /tmp/release-body.md
          else
            echo "::warning::No changelog.umh.app entry for ${VERSION}; the release notes have no link to it. Run Sync Changelog, then this workflow again."
          fi

      - name: Update GitHub Release
        if: steps.changelog.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --notes-file /tmp/release-body.md
