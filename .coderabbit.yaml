# Query the connected MCP servers (the Engineering Handbook and docs.umh.app) during reviews.
# The default, auto, skips them on public repositories like this one.
knowledge_base:
  mcp:
    usage: enabled
reviews:
  high_level_summary: false
  poem: false
  collapse_walkthrough: true
  profile: chill # There is another profile called 'assertive' which is so nitpicky
  path_filters:
    - "!umh-core/vendor/**"
