kind: fixes
body: 'OPC UA input with `autoReconnect` enabled: after a short connection loss in which the server kept the session, the bridge no longer stops delivering data while still showing as connected and logging no error. It now also recovers the values it missed during the loss, as far as the server still holds them; values the server already discarded, for example from a full `queueSize` queue, stay lost'
time: 2026-11-18T21:00:07.000000+01:00
