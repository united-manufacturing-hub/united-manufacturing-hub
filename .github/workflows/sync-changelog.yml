# Syncs the release notes of a stable version to changelog.umh.app.
# release-pipeline.yml calls it for the released version. CHANGELOG.md is read
# from the calling commit (staging), which has the version's section. The notes
# come from release-notes.sh: a version superseded by this release gets no entry
# of its own, and its section is part of this release's entry.

name: Sync Changelog

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to sync (e.g., v0.44.8).'
        required: true
        type: string
      title:
        description: 'Title for the changelog entry. Defaults to the version.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without creating PR (just logs output)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version to sync (e.g., v0.44.8).'
        required: true
        type: string
      title:
        description: 'Title for the changelog entry. Defaults to the version.'
        required: false
        type: string

jobs:
  sync:
    name: Sync to changelog.umh.app
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Determine version and title
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          echo "title=${INPUT_TITLE:-$INPUT_VERSION}" >> $GITHUB_OUTPUT

      - name: Checkout umh-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/
            umh-core/CHANGELOG.md
            umh-core/changelog-images/
          path: umh-core

      # The sync script reads one `## [X.Y.Z]` section from a changelog file.
      - name: Write the release notes as a changelog section
        working-directory: umh-core
        env:
          SYNC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          semver="${SYNC_VERSION#v}"
          notes=$(VERSION="$semver" .github/scripts/release-notes.sh)
          if [ -z "$notes" ]; then
            echo "::error::umh-core/CHANGELOG.md has no section for ${semver}."
            exit 1
          fi
          printf '## [%s]\n%s\n' "$semver" "$notes" > "$RUNNER_TEMP/release-notes.md"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.CHANGELOG_SYNC_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_SYNC_APP_PK }}
          repositories: changelog.umh.app

      - name: Checkout changelog.umh.app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: united-manufacturing-hub/changelog.umh.app
          token: ${{ steps.app-token.outputs.token }}
          path: changelog-app

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: changelog-app
        run: npm ci

      - name: Run sync script
        working-directory: changelog-app
        env:
          SYNC_VERSION: ${{ steps.version.outputs.version }}
          SYNC_TITLE: ${{ steps.version.outputs.title }}
        run: |
          npx tsx .github/scripts/sync-changelog.ts \
            --repo umh-core \
            --version "$SYNC_VERSION" \
            --title "$SYNC_TITLE" \
            --changelog-path "$RUNNER_TEMP/release-notes.md" \
            --images-path ../umh-core/umh-core/changelog-images \
            --output-path public/changelog/entries

      - name: Show output (dry run)
        if: inputs.dry_run == true
        working-directory: changelog-app
        run: |
          echo "=== Generated files ==="
          git status --short
          echo ""
          echo "=== New entry content ==="
          git diff --no-color
          echo ""
          for f in $(git ls-files --others --exclude-standard); do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done

      - name: Create Pull Request
        if: inputs.dry_run != true
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: changelog-app
          branch: sync/umh-core-${{ steps.version.outputs.version }}
          title: "sync: umh-core ${{ steps.version.outputs.version }}"
          body: |
            Automated sync of changelog entries from umh-core ${{ steps.version.outputs.version }}.

            Generated by the [sync-changelog workflow](https://github.com/united-manufacturing-hub/united-manufacturing-hub/actions/workflows/sync-changelog.yml).
          commit-message: "sync: add umh-core ${{ steps.version.outputs.version }} changelog entry"
          delete-branch: true

      - name: Merge changelog PR
        if: inputs.dry_run != true && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          # changelog.umh.app does not allow auto-merge, so merge directly.
          # Right after the PR is created, GitHub reports mergeStateStatus
          # UNKNOWN until it has computed mergeability.
          # Check the state up to 30 times, 2s apart, which takes a minute or more.
          # A failed lookup or an empty result counts as UNKNOWN and is retried.
          # If the state is still UNKNOWN after the last check, the step fails
          # without merging.
          # Any other state goes to gh pr merge, which fails on its own for
          # states such as DIRTY or BLOCKED.
          for _ in $(seq 1 30); do
            state=$(gh pr view "$PR_NUMBER" \
              --repo united-manufacturing-hub/changelog.umh.app \
              --json mergeStateStatus --jq .mergeStateStatus) || state=UNKNOWN
            state=${state:-UNKNOWN}
            [ "$state" != "UNKNOWN" ] && break
            sleep 2
          done
          echo "mergeStateStatus: $state"
          if [ "$state" = "UNKNOWN" ]; then
            echo "::error::changelog PR #$PR_NUMBER mergeStateStatus still UNKNOWN after 30 checks"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" \
            --repo united-manufacturing-hub/changelog.umh.app \
            --squash
