# The dataContractsV2 section is the merged data contract concept: one entry
# carries the structure and every version of a contract. It stands on its own,
# so nothing here is read from the older dataModels and dataContracts sections,
# and nothing declared there appears on the data contracts page.

agent:
  metricsPort: 8080
  location:
    0: test-enterprise
    1: test-site

dataContractsV2:
  - name: pump
    description: Pump telemetry
    version:
      v1:
        structure:
          pressure:
            _payloadshape: timeseries-number
      v2:
        structure:
          pressure:
            _payloadshape: timeseries-number
          temperature:
            _payloadshape: timeseries-number

  - name: motor
    description: Motor telemetry
    version:
      v1:
        structure:
          rpm:
            _payloadshape: timeseries-number
