# A topic is one concrete UNS topic. A regular expression over topics is a topic pattern.
extends: existence
message: "A topic is one concrete UNS topic. Call the regular expression a topic pattern. See umh-core/docs/CLAUDE.md."
level: warning
ignorecase: true
tokens:
  - '\btopics?\b(?!\s+patterns?\b)[^.]{0,40}?\b(?:is|are) (?:a )?regular expressions?'
