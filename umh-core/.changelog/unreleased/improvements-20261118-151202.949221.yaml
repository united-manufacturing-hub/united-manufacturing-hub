kind: improvements
body: 'With `USE_FSMV2_BENTHOS_METRICS=true`, a flow''s degraded status reads differently. Output and processor errors stop counting 10 minutes after the last error, without a restart. A flow then leaves degraded on its own once its log check also passes. It shows idle until it processes data again. The reason names the count, the window and how long ago the newest error was, as in `benthos reported 3 output errors in the last 10m, last one 4m ago`, and a flow whose input or output is not connected says so. Errors Benthos counted before umh-core first read its metrics are no longer held against the flow, so restarting umh-core no longer brings old errors back. Two reasons are new: `no Benthos metrics yet` until the first reading arrives, and `no fresh Benthos metrics` when the last good reading has aged out. Without the flag, nothing changes. See [Why a Data Flow Is Degraded](https://docs.umh.app/usage/data-flows/why-a-flow-is-degraded)'
