# Adds Vale warnings for the docs terminology to the lines a pull request adds.
# The rules are in umh-core/docs/.vale/styles/UMH/, the terms in umh-core/docs/CLAUDE.md.
# The check never fails the pull request.
name: Docs Lint

on:
  pull_request:
    paths:
      - "umh-core/docs/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  vale:
    name: Vale
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Vale and reviewdog can still fail the step, for example on a broken rule.
      # continue-on-error keeps the job green, as the check is not required.
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        continue-on-error: true
        with:
          version: 3.28.1
          sync: false
          files: umh-core/docs
          vale_flags: "--config=umh-core/docs/.vale.ini"
          reporter: github-pr-annotations
          level: warning
          filter_mode: added
          fail_on_error: false
