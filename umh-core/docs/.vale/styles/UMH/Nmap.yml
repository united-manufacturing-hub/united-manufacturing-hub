# The docs describe the connection probe by what it does, not by the tool
# behind it. Vale skips code spans and code blocks, so the literal `nmap:` YAML
# key, the `NMAP_BACKEND` variable and the `(nmap)` label stay in code.
extends: existence
message: "Do not name nmap. Say 'connection probe': it checks whether the external system is reachable. Put a literal key or variable in code."
level: warning
ignorecase: true
tokens:
  - 'nmap'
  - 'NMAP_BACKEND'
