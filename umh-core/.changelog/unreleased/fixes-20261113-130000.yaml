kind: fixes
body: Updated the OpenTelemetry log SDK (v0.19.0 to v1.47.0) and the Redpanda OpenTelemetry exporter that uses it, so a full log export buffer can no longer make the batch log processor spin and use up the CPU. benthos-umh itself does not set up such a processor, so only a custom setup that exports OpenTelemetry logs was exposed (CVE-2026-81872). Images built before v0.17.0 still contain the older version
time: 2026-11-13T13:00:00.000000+01:00
