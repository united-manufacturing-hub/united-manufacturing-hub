# Every Sentry event umh-core can report. Editing this file is how an event comes
# to exist; identifiers.gen.go is generated from it by `make generate-telemetry`.
#
# A tag and a severity are stable for the life of an entry: both feed the Sentry
# fingerprint, so changing either starts a new issue and orphans the old one's
# history. A brief is safe to edit.
adapter:
  child::spec_build_failed:
    brief: Building a child worker's spec failed, so the child is absent until the next tick retries.
    severity: warning
  child::upsert_failed:
    brief: Upserting a child worker failed, so the child is absent until the next tick retries.
    severity: warning
actions:
  unknown_type:
    brief: The Management Console sent an action type umh-core has no handler for, so it was ignored.
    severity: warning
cse:
  delta::append_failed:
    brief: Appending a delta to the CSE store failed, so this state change is not persisted.
    severity: warning
  delta::query_fallback_to_bootstrap:
    brief: A delta query failed, so the reader fell back to a full bootstrap read.
    severity: warning
examples:
  persistence::observed_state_load_failed:
    brief: The persistence example could not load its observed state.
    severity: warning
  runner::sync_id_fetch_failed:
    brief: The example runner could not fetch the sync id, so its dump shows every change rather than the new ones.
    severity: warning
  scenario::dump_failed:
    brief: Dumping a scenario's state failed, so the run has no artefact to inspect.
    severity: warning
  store::dump_unsupported_for_v2:
    brief: A store dump was requested for an fsmv2 store, which does not support it.
    severity: warning
communicator:
  action_handler::double_panic:
    brief: The action handler panicked while recovering from a panic, so the action is lost and the reply never sent.
    severity: error
  action_handler::panic:
    brief: An action handler panicked; it was recovered, so umh-core keeps running but the action did not complete.
    severity: error
  action_handler::panic_reply_generation_failed:
    brief: After recovering an action-handler panic, building the failure reply also failed, so the console hears nothing.
    severity: error
  bridge::deploy::add_failed:
    brief: Adding the bridge to config.yaml failed, so the bridge was not deployed.
    severity: error
  bridge::deploy::create_config_failed:
    brief: Building the bridge's config failed, so nothing was written and the bridge was not deployed.
    severity: error
  bridge::deploy::stop_on_failure_failed:
    brief: A bridge deployment failed and stopping the half-deployed bridge also failed, so it may still be running.
    severity: error
  bridge::deploy::stop_on_failure_get_config_failed:
    brief: A bridge deployment failed and reading its config to stop it also failed, so it may still be running.
    severity: error
  bridge::deploy::timeout:
    brief: The bridge did not reach its desired state within the deployment timeout.
    severity: warning
  bridge::deploy::wait_failed:
    brief: Waiting for the deployed bridge to come up failed, so its state is unknown.
    severity: error
  bridge::edit::apply_mutation_failed:
    brief: Applying the edit to the bridge's config failed, so the bridge is unchanged.
    severity: error
  bridge::edit::config_error_rollback_failed:
    brief: A bridge edit produced an invalid config and the rollback also failed, so config.yaml holds the bad edit.
    severity: error
  bridge::edit::config_error_rolled_back:
    brief: A bridge edit produced an invalid config and was rolled back, so the bridge keeps its previous config.
    severity: warning
  bridge::edit::persist_config_failed:
    brief: Writing the edited bridge config failed, so the edit did not take.
    severity: error
  bridge::edit::render_failure_rollback_failed:
    brief: A bridge edit failed to render and the rollback also failed, so config.yaml holds a template that will not render.
    severity: error
  bridge::edit::render_failure_rolled_back:
    brief: A bridge edit failed to render and was rolled back, so the bridge keeps its previous config.
    severity: warning
  bridge::edit::rollback_failed:
    brief: Rolling back a failed bridge edit failed, so config.yaml may hold a half-applied edit.
    severity: error
  bridge::edit::rollback_on_timeout:
    brief: An edited bridge did not come up in time, so the edit was rolled back.
    severity: warning
  bridge::edit::rollout_failed:
    brief: Rolling out the bridge edit failed, so the bridge may be running its old config.
    severity: error
  bridge::execute_failed:
    brief: Executing the bridge action failed, so the requested change did not happen.
    severity: error
  bridge::parse_failed:
    brief: The bridge action's payload could not be parsed, so the action was rejected.
    severity: error
  bridge::validate_failed:
    brief: The bridge action's payload failed validation, so the action was rejected.
    severity: error
config:
  agent::location_map_missing:
    brief: config.yaml had no agent location map, so an empty one was substituted.
    severity: warning
  agent::release_channel_invalid:
    brief: config.yaml named a release channel umh-core does not know, so it was set to n/a.
    severity: warning
  backup::cleanup::dir_read_failed:
    brief: The config backup directory could not be listed, so old backups were not pruned.
    severity: warning
  backup::cleanup::remove_failed:
    brief: An old config backup could not be deleted, so the backup directory keeps growing.
    severity: warning
  backup::dir_create_failed:
    brief: The config backup directory could not be created, so this config was not backed up.
    severity: warning
  backup::dir_read_failed:
    brief: The config backup directory could not be listed, so no backup could be chosen.
    severity: warning
  backup::exists_check_failed:
    brief: Checking whether a config backup exists failed, so backup was skipped for this write.
    severity: warning
  backup::latest_read_failed:
    brief: The most recent config backup could not be read, so it cannot be restored from.
    severity: warning
  backup::read_failed:
    brief: A config backup could not be read, so this config was not backed up.
    severity: warning
  backup::write_failed:
    brief: Writing the config backup failed, so this config revision has no backup.
    severity: warning
  file::exists_check_failed:
    brief: Checking whether config.yaml exists failed, so the config could not be loaded.
    severity: warning
  manager::permanently_failed:
    brief: The config manager exhausted its backoff and stopped retrying, so config changes no longer apply.
    severity: error
cpu:
  startup::snapshot_failed:
    brief: The startup cgroup snapshot failed, so the CPU quota signals are missing for this run.
    severity: warning
telemetry:
  unregistered_identifier:
    brief: A zero-value telemetry.Identifier reached the logger, so the call site is a bug.
    severity: error
workers:
  auth::failed:
    brief: Authenticating with the Management Console failed, so this instance stays unauthenticated.
    severity: warning
  auth::instance_uuid_missing:
    brief: The auth response carried no instance UUID, so the instance cannot identify itself.
    severity: warning
  auth::persistent_failure:
    brief: Authentication has failed repeatedly, so the instance may appear offline.
    severity: warning
  config::watch::read_failed:
    brief: The config worker could not read config.yaml on this tick, so children were not reconciled.
    severity: warning
  config::watch::cpu_upsert_failed:
    brief: Upserting the CPU monitor child failed, so CPU health is not being collected.
    severity: warning
  config::watch::historian_upsert_failed:
    brief: Upserting the historian child failed, so historian data is not being collected.
    severity: warning
  connect::cancelled_during_delay:
    brief: A reconnect was cancelled while waiting out its backoff delay, which is normal during shutdown.
    severity: warning
  connect::failed_simulated:
    brief: A simulated connection failure fired, which only happens in a test scenario.
    severity: warning
  connect::initial_failed:
    brief: The first connection to the Management Console failed, so the instance starts offline.
    severity: warning
  pull::dependencies_creation_failed:
    brief: The pull worker's dependencies could not be created, so it cannot receive actions.
    severity: error
  pull::parent_transport_deps_missing:
    brief: The pull worker found no transport dependencies published by its parent, so it cannot start.
    severity: error
  pull::persistent_failure:
    brief: Pulling from the Management Console has failed repeatedly, so actions are not arriving.
    severity: warning
  pull::skipped_nil_inbound_chan:
    brief: A pull was skipped because the inbound channel was nil, so the message was not delivered.
    severity: warning
  pull::skipped_nil_inbound_chan_with_pending:
    brief: A pull was skipped on a nil inbound channel while deliveries were pending, so those are dropped.
    severity: warning
  push::dependencies_creation_failed:
    brief: The push worker's dependencies could not be created, so it cannot send status.
    severity: error
  push::parent_transport_deps_missing:
    brief: The push worker found no transport dependencies published by its parent, so it cannot start.
    severity: error
  push::persistent_failure:
    brief: Pushing to the Management Console has failed repeatedly, so the instance may appear offline.
    severity: warning
  transport::backpressure_entering:
    brief: The outbound queue filled, so the transport started shedding load.
    severity: warning
  transport::backpressure_exiting:
    brief: The outbound queue drained, so the transport stopped shedding load.
    severity: warning
  transport::channel_provider_not_initialized:
    brief: The channel provider was not initialised, so no messages can move in either direction.
    severity: warning
  transport::pending_buffer_overflow:
    brief: The pending message buffer overflowed, so the oldest messages were dropped.
    severity: warning
  transport::poison_message_dropped:
    brief: A message failed repeatedly and was dropped to stop it blocking the queue.
    severity: warning
  transport::previous_observed_load_failed:
    brief: The previous observed state could not be loaded, so this tick starts from nothing.
    severity: warning
  transport::simulating_panic:
    brief: A deliberate panic was raised, which only happens in a test scenario.
    severity: warning
supervisor:
  action::enqueue_failed:
    brief: Enqueueing an action failed, so the state it was driving toward will not be reached.
    severity: error
  child::initial_desired_state_save_failed:
    brief: A new child's first desired state could not be saved, so it starts with none.
    severity: warning
  child::shutdown_request_failed:
    brief: Requesting a child's shutdown failed, so it may still be running.
    severity: warning
  child::spec_validation_failed:
    brief: A child's spec failed validation, so the child was not created.
    severity: error
  child::start_skipped_context_cancelled:
    brief: A child's start was skipped because the context was already cancelled, which is normal during shutdown.
    severity: warning
  child::supervisor_add_worker_failed:
    brief: Adding a worker to a child supervisor failed, so that worker does not exist.
    severity: error
  child::supervisor_creation_failed:
    brief: Creating a child supervisor failed, so its whole subtree is absent.
    severity: error
  child::tick_failed:
    brief: A child supervisor's tick failed, so its subtree did not reconcile this cycle.
    severity: error
  child::worker_creation_failed:
    brief: Creating a child worker failed, so it does not exist.
    severity: error
  circuit_breaker::opened:
    brief: The circuit breaker opened after repeated failures, so this worker stops being reconciled.
    severity: error
  circuit_breaker::retry_scheduled:
    brief: The circuit breaker scheduled a retry, so reconciliation resumes after the delay.
    severity: warning
  collector::restart_worker_not_found:
    brief: A collector restart named a worker the supervisor does not hold, which is a wiring bug.
    severity: error
  collector::restarting:
    brief: An unresponsive collector is being restarted.
    severity: warning
  collector::start_failed:
    brief: A collector failed to start, so its worker is never observed.
    severity: error
  collector::unresponsive_max_attempts:
    brief: A collector stayed unresponsive through every restart attempt, so this worker stops being observed.
    severity: error
  desired_state::derived_save_failed:
    brief: Saving the derived desired state failed, so the next tick derives it again from older data.
    severity: warning
  desired_state::load_failed:
    brief: Loading a worker's desired state failed, so the reconcile could not run.
    severity: error
  desired_state::load_failed_on_collect:
    brief: Loading desired state failed during collection, so this observation was skipped.
    severity: warning
  escalation::required:
    brief: A worker exhausted its retries and needs a human, so it stays in its failed state.
    severity: error
  escalation::one_retry_remaining:
    brief: A worker has one retry left before it escalates.
    severity: warning
  factory::invalid_supervisor_type:
    brief: A supervisor was requested for a type the factory does not know, so it was not created.
    severity: error
  shutdown::budget_exhausted:
    brief: The graceful-shutdown budget was spent by child drains, so remaining workers were not drained.
    severity: warning
  shutdown::force_exit:
    brief: Graceful shutdown did not finish in time, so umh-core exited anyway; in-flight work is lost.
    severity: warning
  shutdown::graceful_request_failed:
    brief: A graceful shutdown request failed, so that worker may not have drained.
    severity: warning
  shutdown::request_failed:
    brief: Requesting a worker's shutdown failed, so the reconcile stopped.
    severity: error
  shutdown::request_failed_in_cascade:
    brief: One worker's shutdown request failed while shutting every worker down; the cascade continued without it.
    severity: warning
  shutdown::requested_load_failed:
    brief: Loading the shutdown-requested flag failed, so the supervisor cannot tell whether this worker is stopping.
    severity: warning
  shutdown::timeout:
    brief: Graceful shutdown timed out with workers still running, so they were not drained.
    severity: warning
  observed_state::load_failed:
    brief: Loading a worker's observed state failed, so the reconcile could not run.
    severity: error
  panic_circuit::auto_reset:
    brief: The panic circuit reset itself after a quiet period, so ticking resumes.
    severity: warning
  panic_circuit::open:
    brief: The panic circuit opened after repeated tick panics, so this subtree stops ticking.
    severity: warning
  reducer::error:
    brief: A state reducer returned an error, so the worker keeps its previous state.
    severity: warning
  restart::clear_shutdown_failed:
    brief: Clearing the shutdown flag during a restart failed, so the worker may refuse to start.
    severity: warning
  restart::collector_start_failed:
    brief: A restarted worker's collector failed to start, so it is not being observed.
    severity: error
  restart::graceful_timeout:
    brief: A worker did not stop within its restart timeout, so the restart continued without a clean stop.
    severity: warning
  restart::shutdown_request_failed:
    brief: The stop half of a restart failed, so the worker may be running two instances.
    severity: warning
  signal::processing_failed:
    brief: Processing an OS signal failed, so shutdown may not have been initiated.
    severity: error
  signal::unknown_received:
    brief: An OS signal arrived that umh-core has no handler for, so it was ignored.
    severity: error
  snapshot::load_failed:
    brief: Loading a worker's snapshot failed, so it reconciles from nothing.
    severity: error
  snapshot::missing_timestamp:
    brief: A snapshot carried no timestamp, so its freshness cannot be judged.
    severity: warning
  spec::hash_cache_failed:
    brief: Caching a spec hash failed, so the next tick rehashes it.
    severity: warning
  spec::hash_failed:
    brief: Hashing a spec failed, so the supervisor cannot tell whether it changed.
    severity: warning
  spec::original_user_marshal_failed:
    brief: Marshalling the user's original spec failed, so it is not stored for later comparison.
    severity: warning
  spec::original_user_unmarshal_failed:
    brief: Reading back the user's original spec failed, so edits cannot be compared against it.
    severity: warning
  spec::template_rendering_failed:
    brief: Rendering a spec template failed, so the worker's config could not be produced.
    severity: error
  tick::double_panic:
    brief: A tick panicked while recovering from a panic, so this supervisor stops ticking.
    severity: error
  tick::error:
    brief: A tick returned an error, so this cycle did not reconcile.
    severity: error
  tick::panic:
    brief: A tick panicked; it was recovered, so ticking continues from the next cycle.
    severity: error
  worker::add_collect_observed_failed:
    brief: A new worker's first observation failed, so it was not added.
    severity: error
  worker::add_derive_desired_failed:
    brief: Deriving a new worker's desired state failed, so it was not added.
    severity: error
  worker::add_derive_desired_fallback_to_nil:
    brief: A new worker's desired state derived to nothing, so it starts with none.
    severity: warning
  worker::add_marshal_desired_failed:
    brief: Marshalling a new worker's desired state failed, so it was not added.
    severity: error
  worker::add_marshal_observed_failed:
    brief: Marshalling a new worker's observed state failed, so it was not added.
    severity: error
  worker::add_rejected:
    brief: A worker was rejected rather than added, so it does not exist.
    severity: warning
  worker::add_save_desired_failed:
    brief: Saving a new worker's desired state failed, so it was not added.
    severity: error
  worker::add_save_identity_failed:
    brief: Saving a new worker's identity failed, so it was not added.
    severity: error
  worker::add_save_observed_failed:
    brief: Saving a new worker's observed state failed, so it was not added.
    severity: error
  worker::add_unmarshal_desired_failed:
    brief: Reading back a new worker's desired state failed, so it was not added.
    severity: error
  worker::add_unmarshal_observed_failed:
    brief: Reading back a new worker's observed state failed, so it was not added.
    severity: error
  worker::add_zero_timestamp_not_settable:
    brief: A new worker's observed state has a zero timestamp that cannot be set, so its freshness is unjudgeable.
    severity: warning
  worker::removal_not_found:
    brief: A removal named a worker the supervisor does not hold, so nothing was removed.
    severity: warning
  worker::remove_not_found:
    brief: A remove call named a worker the supervisor does not hold, so nothing was removed.
    severity: warning
  worker::restart_not_found:
    brief: A restart named a worker the supervisor does not hold, so nothing was restarted.
    severity: error
  freshness::data_stale:
    brief: A worker's observed state is older than the stale threshold, so it is being reconciled against old data.
    severity: warning
  freshness::data_timeout:
    brief: A worker's observed state is older than the collector timeout, so it is being reconciled against old data.
    severity: warning
  action::enqueue_rejected:
    brief: An action was rejected rather than queued, so it will not run.
    severity: warning
  action::failed:
    brief: A worker action returned an error, so the state it was driving toward was not reached.
    severity: error
  action::panic:
    brief: A worker action panicked; it was recovered, so the supervisor keeps ticking but the action did not complete.
    severity: error
  action::queue_full:
    brief: The action queue is full, so new actions are being dropped.
    severity: error
  action::stuck_detected:
    brief: An action has been running past its deadline and is blocking its worker.
    severity: warning
  action::stuck_force_removed:
    brief: A stuck action was force-removed so its worker could continue; whatever it was doing is unfinished.
    severity: error
  collector::double_panic:
    brief: A collector panicked while recovering from a panic, so it is dead and this worker stops observing.
    severity: error
  collector::final_observation_failed:
    brief: The last observation before shutdown failed, so the worker's final state was not recorded.
    severity: warning
  collector::final_observation_skipped:
    brief: The last observation before shutdown was skipped, so the worker's final state was not recorded.
    severity: warning
  collector::observation_failed:
    brief: Collecting observed state failed, so the supervisor is reconciling against stale data.
    severity: error
  collector::panic:
    brief: A collector panicked; it was recovered and restarted, so observations resume on the next tick.
    severity: error
  collector::restart_failed:
    brief: Restarting an unresponsive collector failed, so this worker stops observing until the next attempt.
    severity: error
  collector::restart_skipped_not_running:
    brief: A restart was requested for a collector that is not running, so there was nothing to restart.
    severity: warning
  collector::restart_no_parent_context:
    brief: A collector restart found no parent context to derive from, which is a wiring bug.
    severity: error
  collector::restart_start_failed:
    brief: A restarted collector failed to start, so this worker stops observing.
    severity: error
  collector::save_failed:
    brief: Saving a collector's observation failed, so the next tick reconciles against older data.
    severity: warning
  collector::stopped:
    brief: A collector stopped, so its worker is no longer being observed.
    severity: warning
  collector::trigger_now_failed:
    brief: An immediate collection could not be triggered, so the next observation waits for the normal interval.
    severity: warning
  collector::type_mismatch:
    brief: A collector produced an observed state of the wrong type, which is a wiring bug.
    severity: error
  observed_state::invalid_timestamp:
    brief: An observed state carried an unusable timestamp, so its freshness cannot be judged.
    severity: warning
  observed_state::missing_timestamp:
    brief: An observed state carried no timestamp, so its freshness cannot be judged.
    severity: warning
  observed_state::timeout:
    brief: No observed state arrived within the timeout, so the supervisor is reconciling against stale data.
    severity: warning
  observed_state::type_unknown:
    brief: An observed state's type is not one the supervisor knows, so it cannot be read.
    severity: warning
  observed_state::unknown_timestamp_type:
    brief: An observed state's timestamp field is of an unexpected type, so its freshness cannot be judged.
    severity: warning
