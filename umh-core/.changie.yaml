# Changelog fragments. Add one per PR with `make changelog`; `make release-changelog` merges them at release.
# CHANGELOG.md is generated from header.tpl.md and one .changelog/<version>.md per release.
# release workflows and changelog.umh.app parse the "## [X.Y.Z]" headings and the kind labels below,
# so both must keep their exact form. Kinds render in this order, which is the order the validator expects.
---
changesDir: .changelog
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
# Sub-second time so two fragments added in quick succession never share a file.
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405.000000"}}'
versionFormat: '## [{{.Version}}]'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
body:
  block: true
kinds:
  - key: new
    label: New Features
  - key: improvements
    label: Improvements
  - key: fixes
    label: Fixes
newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 2
