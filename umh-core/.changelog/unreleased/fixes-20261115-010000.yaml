kind: fixes
body: Updated the OpenTelemetry modules (otel, otel/trace, otel/sdk and otel/sdk/log to v1.47.0), so a trace attribute value made of Unicode replacement characters (U+FFFD) can no longer get past the configured attribute value length limit, and a large W3C baggage header no longer allocates more memory than needed. Only a tracing setup with the open_telemetry_collector or jaeger tracer and a finite attribute length limit was exposed to the first flaw (CVE-2026-128085). The second one (CVE-2026-128086) was only reachable through W3C baggage propagation
time: 2026-11-15T01:00:00.000000+01:00
